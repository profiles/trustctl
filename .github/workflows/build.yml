name: build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: roothide
            archs: "arm64"
            expected_arch: iphoneos-arm64e
          - scheme: rootless
            archs: "arm64"
            expected_arch: iphoneos-arm64
    env:
      ROOTHIDE_THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          
      - name: Check out
        uses: actions/checkout@v6.1.0

      - name: Configure build environment
        shell: bash
        run: echo "THEOS=$RUNNER_TEMP/roothide-theos" >> "$GITHUB_ENV"

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          version_count=$(awk '$1 == "Version:" { count++ } END { print count + 0 }' control)
          version=$(awk '$1 == "Version:" && NF == 2 { print $2 }' control)
          test "$version_count" -eq 1
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check out pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$ROOTHIDE_THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$ROOTHIDE_THEOS_COMMIT"

      - name: Build package (${{ matrix.scheme }})
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} ARCHS="${{ matrix.archs }}" PACKAGE_VERSION="${{ steps.package-version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.scheme }}
          path: |
            packages/*.deb
          if-no-files-found: error
